/* V1.6: styles scoped to the active workout and its action dialog. */
.workout{--accent:#c6f54a;--card:#171719;--input:#141416;--line:#303035}
.workout main{padding-top:calc(env(safe-area-inset-top) + 10px);padding-bottom:calc(104px + env(safe-area-inset-bottom))}
.workout .workout-top{gap:8px;margin-bottom:16px}
.workout .round{width:44px;height:44px;flex:none;font-size:23px}
.workout-position{display:grid;gap:1px;flex:1;text-align:center;line-height:1.3}
.workout-position small{font-size:10px;letter-spacing:1.3px;color:var(--accent);font-weight:750}
.workout-position strong{font-size:14px}
.workout-end{background:#242426;border:1px solid var(--line);border-radius:22px;min-height:44px;padding:8px 12px;font-size:13px;white-space:nowrap}
.workout-hero{display:grid;grid-template-columns:minmax(0,1fr) 92px;align-items:center;gap:12px;margin:5px 0 14px}
.workout-hero .visual{width:100%;margin:0 auto;border-radius:19px;max-width:300px;background:var(--card)}
.workout-hero .oei-frames img{max-height:215px;width:100%;object-fit:contain}
.workout-hero .local-visual>img{max-height:215px;width:100%;object-fit:contain}
.workout .oei-nav button{min-height:36px}
.exercise-progress{display:grid;justify-items:center;gap:8px}
.exercise-ring{width:92px;height:92px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--accent) var(--ring-progress,0%), #323236 0)}
.exercise-ring>div{width:78px;height:78px;display:grid;align-content:center;justify-items:center;gap:0;background:var(--bg);border-radius:50%}
.exercise-ring strong{font-size:23px;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.1}
.exercise-ring small{font-size:11px}
.workout .exercise-title{text-align:left;font-size:25px;line-height:1.18;letter-spacing:-.5px}
.workout-muscles{text-align:left;margin:5px 0 14px}
.workout-quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:12px 0 15px}
.workout-quick button{min-width:0;min-height:60px;padding:8px 2px;display:grid;justify-items:center;gap:2px;background:#1d1d20;border:1px solid var(--line);border-radius:13px;font-size:11px;position:relative}
.workout-quick button b{font-size:19px;line-height:1.3;font-weight:500}
.workout-quick button.selected-action{color:var(--accent);border-color:var(--accent)}
.note-dot{position:absolute;top:7px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.workout-plan{gap:8px;padding:10px 12px;margin:12px 0 15px;border:1px solid var(--line)}
.workout-plan>div:first-child{flex:1;min-width:0}
.workout-plan small{font-size:11px;line-height:1.25}
.workout-plan strong{font-size:15px}
.workout-plan label{max-width:110px}
.workout-plan input{min-height:44px;text-align:center}
.rest-start{flex:none;display:grid;gap:4px;justify-items:center;background:#262729;border:1px solid var(--line);padding:8px 10px;border-radius:12px;min-height:54px}
.rest-start small{color:var(--accent)}
.workout .timer{background:#1d2217;border-color:#3c4f23}
.sets-heading h3{font-size:20px}
.sets-heading small{color:var(--accent);font-weight:650}
.previous-set-note{margin:3px 0 7px;font-size:12px}
.workout .setrow{gap:8px;margin:7px 0}
.workout .setrow:not(.labels){border:1px solid transparent;border-radius:28px;padding:2px}
.workout .setrow input{border-radius:24px;min-height:48px}
.workout .setrow.set-complete{background:#201f17;border-color:#495c29}
.workout .setrow.set-complete input{border-color:#627a35;color:var(--accent)}
.workout .setrow.set-complete .set-num{color:var(--accent);border-color:#627a35}
.workout .setrow button.done{color:#15190b;background:var(--accent)}
.workout .add-set{min-height:48px;color:var(--accent);border-color:#4c5d32;margin-bottom:14px}
.workout .primary,.workout-menu .primary{background:#c6f54a;color:#141809}
.workout .workout-nav .next{min-height:60px;padding:11px 17px;border-radius:20px}
.workout .workout-nav .next small{color:#33451c}
.workout .workout-nav>button:first-child{font-size:24px;width:56px;flex:none;border-radius:19px}
.manage-session{margin-top:8px;background:transparent;border:1px solid var(--line);color:var(--muted)}
.workout-menu{color:var(--text);border:1px solid var(--line);background:#171719;border-radius:24px;padding:18px;width:min(calc(100% - 32px),410px);max-height:calc(100% - 32px);margin:auto;overflow:auto}
.workout-menu::backdrop{background:#000b}
.workout-menu .stack{gap:12px}
.workout-menu h3{font-size:21px}
.workout-menu .menu-close{font-size:23px;border-radius:50%;width:44px;height:44px;padding:0}
.workout-menu button.wide{min-height:52px;border-radius:15px;line-height:1.25}
@media(max-width:350px){.workout-hero{grid-template-columns:minmax(0,1fr) 76px;gap:8px}.exercise-ring{width:76px;height:76px}.exercise-ring>div{width:64px;height:64px}.exercise-ring strong{font-size:20px}.workout-end{padding:8px}.workout-quick button{font-size:10px}.workout-plan{padding:8px;gap:6px}.workout-plan label{max-width:88px}.rest-start{padding:6px}}
